apiVersion: v1
kind: Namespace
metadata:
  name: cloudguard
  labels:
    app.kubernetes.io/name: cloudguard
    app.kubernetes.io/part-of: cloudguard
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudguard-config
  namespace: cloudguard
data:
  ENVIRONMENT: "production"
  REDIS_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudguard-backend
  namespace: cloudguard
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: cloudguard-monitor
      containers:
      - name: backend
        image: cloudguard-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: cloudguard-config
        - secretRef:
            name: cloudguard-secrets
        env:
        - name: K8S_IN_CLUSTER
          value: "true"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: cloudguard-secrets
              key: SECRET_KEY
        - name: DEFAULT_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloudguard-secrets
              key: DEFAULT_ADMIN_PASSWORD
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: cloudguard-secrets
              key: DATABASE_URL
        - name: FALCO_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: cloudguard-secrets
              key: FALCO_WEBHOOK_SECRET
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: cloudguard-secrets
              key: REDIS_URL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cloudguard
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
    name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudguard-frontend
  namespace: cloudguard
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: cloudguard-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cloudguard
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
